<!doctype html>
<html lang="en-IN">
<head>

  <style>
    @font-face { font-family:"Anek Latin"; font-style:normal; font-weight:400 600; font-display:swap; src:url("/assets/fonts/anek-latin.woff2") format("woff2"); }
    :root { --ocean:#155DA6; --ocean-hover:#114D8A; --navy:#122A45; --slate:#526B85; --surface:#F5F8FC; --surf:#78AEE0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Anek Latin",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--navy); background:var(--surface); -webkit-font-smoothing:antialiased; }
    .nf { min-height:100vh; display:flex; align-items:center; padding:48px 0; }
    .container { width:100%; max-width:1200px; margin:0 auto; padding:0 24px; }
    .brand { display:inline-block; margin-bottom:72px; }
    .brand img { display:block; width:160px; height:auto; }
    .label { font-size:13px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--ocean); margin:0 0 20px; }
    h1 { font-size:clamp(40px,6vw,72px); font-weight:500; letter-spacing:-.025em; line-height:1.05; margin:0 0 20px; display:flex; align-items:baseline; }
    h1::after { content:""; flex:0 1 128px; min-width:32px; height:1.5px; margin-left:.18em; background:var(--surf); }
    p.lead { font-size:20px; line-height:1.55; color:var(--slate); margin:0 0 36px; max-width:520px; }
    .btn { display:inline-flex; align-items:center; min-height:48px; background:var(--ocean); color:#fff; text-decoration:none; font-size:17px; font-weight:500; padding:14px 24px; border-radius:4px; }
    .btn:hover { background:var(--ocean-hover); }
    :focus-visible { outline:2px solid var(--ocean); outline-offset:3px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="container">
      <a class="brand" href="/" aria-label="Bluarc Labs home"><img src="/assets/brand/lockup.svg" width="160" height="43" alt="Bluarc Labs"></a>

      <a class="btn" href="/">Back to home</a>
