<!doctype html>
<html lang="en-IN">
<head>

  <link rel="preload" href="/assets/fonts/BluArcSans-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family:"BluArc Sans"; font-style:normal; font-weight:400; font-display:swap; src:url("/assets/fonts/BluArcSans-Regular.woff2") format("woff2"); }
    @font-face { font-family:"BluArc Sans"; font-style:normal; font-weight:500; font-display:swap; src:url("/assets/fonts/BluArcSans-Medium.woff2") format("woff2"); }
    @font-face { font-family:"BluArc Sans"; font-style:normal; font-weight:700; font-display:swap; src:url("/assets/fonts/BluArcSans-Bold.woff2") format("woff2"); }
    :root { --sky:#1F8FD8; --black:#0B0B0C; --white:#FFFFFF; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"BluArc Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--black); background:var(--white); -webkit-font-smoothing:antialiased; }
    .nf { min-height:100vh; display:flex; align-items:center; padding:48px 0; }
    .container { width:100%; max-width:1200px; margin:0 auto; padding:0 24px; }
    .brand { display:inline-block; margin-bottom:72px; }
    .brand img { display:block; width:196px; height:auto; }
    .label { font-size:13px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; margin:0 0 20px; }
    h1 { font-size:clamp(40px,6vw,72px); font-weight:700; letter-spacing:-.02em; line-height:1.05; margin:0 0 20px; color:var(--sky); }
    p.lead { font-size:20px; line-height:1.55; margin:0 0 36px; max-width:520px; }
    .btn { display:inline-flex; align-items:center; min-height:48px; background:var(--black); color:var(--white); text-decoration:none; font-size:17px; font-weight:500; padding:14px 26px; border-radius:999px; }
    .btn:hover { background:#2A2A2D; }
    :focus-visible { outline:2px solid var(--sky); outline-offset:3px; }
  </style>
</head>

    <div class="container">

      <a class="btn" href="/">Back to home</a>
    </div>
  </main>
</body>
